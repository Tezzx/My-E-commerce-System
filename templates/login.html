<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商系统 - 登录</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display:flex; justify-content:center; align-items:center; height:100vh; }
        .card { background:#fff; padding:40px; border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.3); width:380px; }
        .card h2 { text-align:center; color:#333; margin-bottom:8px; font-size:24px; }
        .card .sub { text-align:center; color:#999; margin-bottom:24px; font-size:13px; }
        .tab-row { display:flex; margin-bottom:24px; border-radius:8px; overflow:hidden; border:1px solid #e0e0e0; }
        .tab-row button { flex:1; padding:10px; border:none; background:#f5f5f5; cursor:pointer; font-size:14px; transition:.2s; }
        .tab-row button.active { background:#667eea; color:#fff; }
        .field { margin-bottom:16px; }
        .field label { display:block; font-size:13px; color:#555; margin-bottom:4px; }
        .field input { width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; outline:none; transition:border .2s; }
        .field input:focus { border-color:#667eea; }
        .btn { width:100%; padding:12px; border:none; border-radius:8px; background:#667eea; color:#fff; font-size:16px; cursor:pointer; transition:.2s; }
        .btn:hover { background:#5a6fd6; }
        .msg { margin-top:16px; text-align:center; font-size:13px; min-height:20px; }
        .msg.success { color:#22c55e; }
        .msg.error { color:#ef4444; }
    </style>
</head>
<body>
<div class="card">
    <h2>🛒 电商系统</h2>
    <p class="sub">订单支付一体化平台</p>
    <div class="tab-row">
        <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
        <button id="tabReg" onclick="switchTab('register')">注册</button>
    </div>
    <div id="formLogin">
        <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
        <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
        <button class="btn" onclick="doLogin()">登 录</button>
    </div>
    <div id="formReg" style="display:none">
        <div class="field"><label>用户名</label><input id="regUser" placeholder="3-32位字母数字"></div>
        <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="至少6位"></div>
        <div class="field"><label>确认密码</label><input id="regPass2" type="password" placeholder="再次输入密码"></div>
        <button class="btn" onclick="doRegister()">注 册</button>
    </div>
    <div id="msgBox" class="msg"></div>
</div>

<script>
const BASE = '';
let mode = 'login';

function switchTab(t) {
    mode = t;
    document.getElementById('tabLogin').className = t==='login'?'active':'';
    document.getElementById('tabReg').className = t==='register'?'active':'';
    document.getElementById('formLogin').style.display = t==='login'?'block':'none';
    document.getElementById('formReg').style.display = t==='register'?'block':'none';
    msg('');
}

function msg(m, type) {
    const el = document.getElementById('msgBox');
    el.textContent = m; el.className = 'msg '+(type||'');
}

async function doLogin() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    if(!u||!p) return msg('用户名和密码不能为空','error');
    msg('登录中...','');
    try {
        const r = await fetch(BASE+'/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        const d = await r.json();
        if(d.message==='success'){ msg('登录成功','success'); localStorage.setItem('token',d.data); localStorage.setItem('username',u); setTimeout(()=>location.href='/',600); }
        else msg(d.message,'error');
    }catch(e){ msg('网络异常','error'); }
}

async function doRegister() {
    const u = document.getElementById('regUser').value.trim();
    const p = document.getElementById('regPass').value.trim();
    const p2 = document.getElementById('regPass2').value.trim();
    if(!u||!p) return msg('用户名和密码不能为空','error');
    if(p!==p2) return msg('两次密码不一致','error');
    msg('注册中...','');
    try {
        const r = await fetch(BASE+'/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        const d = await r.json();
        if(d.message==='success'){ msg('注册成功，请登录','success'); switchTab('register'); document.getElementById('loginUser').value=u; }
        else msg(d.message,'error');
    }catch(e){ msg('网络异常','error'); }
}
</script>
</body>
</html>
