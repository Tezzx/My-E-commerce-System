<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商系统</title>
    <style>
        :root { --pri: #667eea; --pri2: #764ba2; --green: #22c55e; --red: #ef4444; --orange: #f59e0b; --bg: #f0f2f5; --card: #fff; --text: #333; --sub: #888; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
        /* Header */
        .header { background: linear-gradient(135deg, var(--pri), var(--pri2)); color:#fff; padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:56px; box-shadow:0 2px 8px rgba(0,0,0,.15); position:sticky; top:0; z-index:100; }
        .header .logo { font-size:20px; font-weight:700; }
        .header .user { display:flex; align-items:center; gap:12px; }
        .header .user span { font-size:14px; opacity:.9; }
        .header .user button { padding:6px 16px; border:1px solid rgba(255,255,255,.4); border-radius:6px; background:rgba(255,255,255,.15); color:#fff; cursor:pointer; font-size:13px; }
        .header .user button:hover { background:rgba(255,255,255,.25); }
        /* Nav */
        .nav { display:flex; background:#fff; border-bottom:1px solid #e5e7eb; padding:0 24px; gap:4px; }
        .nav a { padding:12px 20px; text-decoration:none; color:var(--sub); font-size:14px; border-bottom:3px solid transparent; cursor:pointer; transition:.2s; }
        .nav a:hover, .nav a.active { color:var(--pri); border-bottom-color:var(--pri); }
        /* Main */
        .main { max-width:1200px; margin:24px auto; padding:0 24px; }
        .section { display:none; }
        .section.active { display:block; }
        .card { background:var(--card); border-radius:12px; padding:24px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
        .card h3 { font-size:16px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        /* Grid */
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
        .gcard { background:#fff; border-radius:10px; padding:16px; border:1px solid #eee; transition:box-shadow .2s; }
        .gcard:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); }
        .gcard .gname { font-size:15px; font-weight:600; margin-bottom:8px; }
        .gcard .gprice { color:var(--red); font-size:20px; font-weight:700; }
        .gcard .gprice span { font-size:14px; }
        .gcard .gmeta { color:var(--sub); font-size:12px; margin:4px 0; }
        .gcard .gact { display:flex; gap:8px; margin-top:12px; align-items:center; }
        .gcard .gact input { width:60px; padding:6px; border:1px solid #ddd; border-radius:6px; text-align:center; font-size:14px; }
        /* Buttons */
        .btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; transition:.2s; }
        .btn-pri { background:var(--pri); color:#fff; } .btn-pri:hover { opacity:.9; }
        .btn-out { background:#fff; border:1px solid var(--pri); color:var(--pri); }
        .btn-red { background:var(--red); color:#fff; }
        .btn-green { background:var(--green); color:#fff; }
        .btn-sm { padding:4px 10px; font-size:12px; }
        /* Table */
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; text-align:left; border-bottom:1px solid #eee; font-size:13px; }
        th { color:var(--sub); font-weight:500; }
        .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; }
        .badge-pend { background:#fef3c7; color:#92400e; }
        .badge-paid { background:#dbeafe; color:#1e40af; }
        .badge-ship { background:#e0e7ff; color:#3730a3; }
        .badge-done { background:#d1fae5; color:#065f46; }
        .badge-cancel { background:#fee2e2; color:#991b1b; }
        /* Modal */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; justify-content:center; align-items:center; }
        .modal.show { display:flex; }
        .modal .modal-card { background:#fff; border-radius:12px; padding:24px; width:440px; max-height:80vh; overflow-y:auto; }
        .modal .modal-card h3 { margin-bottom:16px; }
        .form-row { display:flex; gap:8px; margin-bottom:12px; }
        .form-row input, .form-row select { flex:1; padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:13px; }
        /* Toast */
        .toast { position:fixed; top:20px; right:20px; padding:12px 24px; border-radius:8px; color:#fff; font-size:14px; z-index:300; animation:slideIn .3s; }
        .toast.success { background:var(--green); }
        .toast.error { background:var(--red); }
        @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
        /* Category filter */
        .cat-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
        .cat-tag { padding:6px 14px; border-radius:20px; border:1px solid #ddd; cursor:pointer; font-size:13px; transition:.2s; }
        .cat-tag:hover, .cat-tag.active { border-color:var(--pri); color:var(--pri); background:#eef2ff; }
        /* Empty */
        .empty { text-align:center; padding:40px; color:var(--sub); }
        /* Rating stars */
        .stars { color:var(--orange); }
        /* Responsive */
        @media(max-width:768px){ .grid{grid-template-columns:1fr;} .nav a{padding:10px 12px;font-size:12px;} }
    </style>
</head>
<body>
<!-- Header -->
<div class="header">
    <div class="logo">🛒 电商平台</div>
    <div class="user">
        <span id="headerUser"></span>
        <button onclick="logout()">退出</button>
    </div>
</div>

<!-- Navigation -->
<div class="nav">
    <a class="active" data-tab="goods" onclick="switchSection('goods')">🏠 商品</a>
    <a data-tab="cart" onclick="switchSection('cart')">🛒 购物车 <span id="cartBadge" style="background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;display:none;"></span></a>
    <a data-tab="orders" onclick="switchSection('orders')">📦 订单</a>
    <a data-tab="address" onclick="switchSection('address')">📍 地址</a>
    <a data-tab="reviews" onclick="switchSection('reviews')">⭐ 评价</a>
</div>

<!-- Main Content -->
<div class="main">
    <!-- Goods Section -->
    <div id="sec-goods" class="section active">
        <div class="card">
            <div class="cat-bar" id="catBar"><span class="cat-tag active" onclick="filterGoods(0)">全部</span></div>
        </div>
        <div class="grid" id="goodsGrid"></div>
    </div>

    <!-- Cart Section -->
    <div id="sec-cart" class="section">
        <div id="cartList"></div>
        <div class="card" id="cartFoot" style="display:none; display:flex; justify-content:space-between; align-items:center;">
            <div>合计: <b style="color:var(--red);font-size:18px;" id="cartTotal"></b></div>
            <button class="btn btn-pri" onclick="showCheckout()">去结算</button>
        </div>
    </div>

    <!-- Orders Section -->
    <div id="sec-orders" class="section">
        <div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <label style="font-size:13px;">状态:</label>
            <select id="orderStatusFilter" onchange="loadOrders(1)" style="padding:6px 12px;border:1px solid #ddd;border-radius:6px;">
                <option value="">全部</option>
                <option value="0">待支付</option>
                <option value="1">已支付</option>
                <option value="2">已取消</option>
                <option value="3">已发货</option>
                <option value="4">已收货</option>
                <option value="5">已完成</option>
                <option value="6">退款中</option>
                <option value="7">已退款</option>
            </select>
            <span style="font-size:12px;color:var(--sub);margin-left:auto;" id="orderPageInfo"></span>
        </div>
        <div id="orderList"></div>
        <div id="orderPager" style="display:flex;justify-content:center;gap:8px;margin-top:16px;"></div>
    </div>

    <!-- Address Section -->
    <div id="sec-address" class="section">
        <div class="card"><button class="btn btn-pri" onclick="showAddrModal()">+ 新增地址</button></div>
        <div id="addrList"></div>
    </div>

    <!-- Reviews Section -->
    <div id="sec-reviews" class="section">
        <div class="card">
            <select id="revGoodsSelect" onchange="loadReviews()" style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;">
                <option value="">-- 选择商品查看评价 --</option>
            </select>
        </div>
        <div id="reviewList"></div>
    </div>

    <!-- Goods Management Section (Admin/Merchant) -->
    <div id="sec-goods-mgr" class="section">
        <div class="card"><button class="btn btn-pri" onclick="showGoodsForm()">+ 新增商品</button></div>
        <div id="goodsMgrList"></div>
        <div id="goodsMgrPager" style="display:flex;justify-content:center;gap:8px;margin-top:16px;"></div>
    </div>

    <!-- Review Moderation Section (Admin) -->
    <div id="sec-review-mgr" class="section">
        <h3 style="margin-bottom:12px;">📋 评价审核</h3>
        <div id="pendingReviewList"></div>
        <div id="pendingReviewPager" style="display:flex;justify-content:center;gap:8px;margin-top:16px;"></div>
    </div>
</div>

<!-- Address Modal -->
<div class="modal" id="addrModal">
    <div class="modal-card">
        <h3 id="addrModalTitle">新增地址</h3>
        <input type="hidden" id="addrEditId">
        <div class="form-row"><input id="addrReceiver" placeholder="收件人姓名"></div>
        <div class="form-row"><input id="addrPhone" placeholder="手机号"></div>
        <div class="form-row"><input id="addrProvince" placeholder="省"><input id="addrCity" placeholder="市"><input id="addrDistrict" placeholder="区"></div>
        <div class="form-row"><input id="addrDetail" placeholder="详细地址 (街道/门牌号)" style="flex:3"></div>
        <div class="form-row"><label style="font-size:13px;display:flex;align-items:center;gap:6px;"><input type="checkbox" id="addrDefault"> 设为默认地址</label></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
            <button class="btn btn-out" onclick="closeAddrModal()">取消</button>
            <button class="btn btn-pri" id="addrSaveBtn" onclick="saveAddress()">保存</button>
        </div>
    </div>
</div>

<!-- Checkout Modal -->
<div class="modal" id="checkoutModal">
    <div class="modal-card">
        <h3>确认下单</h3>
        <p style="color:var(--sub);margin-bottom:12px;">请选择收货地址:</p>
        <div id="checkoutAddrs" style="max-height:200px;overflow-y:auto;"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
            <button class="btn btn-out" onclick="closeCheckout()">取消</button>
            <button class="btn btn-pri" id="checkoutBtn" onclick="doCheckout()">确认下单</button>
        </div>
    </div>
</div>

<!-- Order Detail Modal -->
<div class="modal" id="orderModal">
    <div class="modal-card" style="width:520px;" id="orderDetail"></div>
</div>

<!-- Review Modal -->
<div class="modal" id="reviewModal">
    <div class="modal-card">
        <h3>商品评价</h3>
        <input type="hidden" id="revGoodsId">
        <input type="hidden" id="revOrderNo">
        <div class="form-row"><label>评分:</label><select id="revRating"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select></div>
        <div class="form-row"><input id="revContent" placeholder="分享您的体验 (可选)" style="flex:3"></div>
        <div class="form-row"><label style="font-size:13px;"><input type="checkbox" id="revAnon"> 匿名评价</label></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
            <button class="btn btn-out" onclick="closeReviewModal()">取消</button>
            <button class="btn btn-pri" onclick="submitReview()">提交</button>
        </div>
    </div>
</div>

<!-- Refund Request Modal -->
<div class="modal" id="refundModal">
    <div class="modal-card">
        <h3>申请退款</h3>
        <input type="hidden" id="refundOrderNo">
        <div class="form-row"><label>订单号:</label><span id="refundOrderNoLabel" style="font-weight:600;"></span></div>
        <div class="form-row"><input id="refundReason" placeholder="请填写退款原因（必填）" style="flex:3"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
            <button class="btn btn-out" onclick="closeRefundModal()">取消</button>
            <button class="btn btn-red" onclick="submitRefund()">提交退款申请</button>
        </div>
    </div>
</div>

<!-- Refund Process Modal (Admin) -->
<div class="modal" id="refundProcessModal">
    <div class="modal-card">
        <h3>退款审批</h3>
        <input type="hidden" id="rpOrderNo">
        <div class="form-row"><label>订单号:</label><span id="rpOrderNoLabel" style="font-weight:600;"></span></div>
        <div class="form-row"><input id="rpRemark" placeholder="审批备注" style="flex:3"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
            <button class="btn btn-out" onclick="closeRefundProcess()">取消</button>
            <button class="btn btn-red" onclick="processRefund(false)">拒绝退款</button>
            <button class="btn btn-green" onclick="processRefund(true)">同意退款</button>
        </div>
    </div>
</div>

<!-- Goods Form Modal -->
<div class="modal" id="goodsFormModal">
    <div class="modal-card">
        <h3 id="goodsFormTitle">新增商品</h3>
        <input type="hidden" id="goodsEditId">
        <div class="form-row"><input id="gformName" placeholder="商品名称（必填）"></div>
        <div class="form-row"><input id="gformPrice" type="number" placeholder="价格（分，必填）"><input id="gformStock" type="number" placeholder="库存数量（必填）"></div>
        <div class="form-row"><input id="gformCategory" type="number" placeholder="分类ID（可选）"><input id="gformImage" placeholder="图片URL（可选）"></div>
        <div class="form-row"><label style="font-size:13px;"><select id="gformStatus"><option value="1">上架</option><option value="0">下架</option></select></label></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
            <button class="btn btn-out" onclick="closeGoodsForm()">取消</button>
            <button class="btn btn-pri" onclick="saveGoods()">保存</button>
        </div>
    </div>
</div>

<script>
// ==================== 全局状态 ====================
const BASE = '';
let token = localStorage.getItem('token')||'';
let curTab = 'goods';
let selectedAddrId = null;
let goodsCache = [];
let cartCache = [];
let userRole = localStorage.getItem('role')||'user'; // user/merchant/admin
let orderPage = 1, orderPageSize = 10;
let goodsMgrPage = 1, goodsMgrPageSize = 10;
let pendingReviewPage = 1, pendingReviewPageSize = 10;

// ==================== 初始化 ====================
(async function init() {
    if(!token){ location.href='/auth'; return; }
    // 获取用户角色
    try {
        const me = await api('/home/me');
        if(me.code===0&&me.data){
            userRole = me.data.role||'user';
            localStorage.setItem('role', userRole);
            localStorage.setItem('username', me.data.username);
        }
    }catch(e){}
    document.getElementById('headerUser').textContent = (userRole!=='user'?'🔧 ':'👤 ')+localStorage.getItem('username');
    // 管理员/商家显示管理导航
    if(userRole==='admin'||userRole==='merchant'){
        document.querySelector('.nav').innerHTML += '<a data-tab="goods-mgr" onclick="switchSection(\'goods-mgr\')">📋 商品管理</a>';
    }
    if(userRole==='admin'){
        document.querySelector('.nav').innerHTML += '<a data-tab="review-mgr" onclick="switchSection(\'review-mgr\')">✅ 评价审核</a>';
    }
    loadCategories();
    loadGoods();
    loadCartBadge();
})();

// ==================== API 封装 ====================
async function api(url, opts={}) {
    opts.headers = Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token}, opts.headers||{});
    const r = await fetch(BASE+url, opts);
    return r.json();
}

function toast(msg, type='success') {
    const t = document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2500);
}

// ==================== 导航 ====================
function switchSection(tab) {
    document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));
    const navEl = document.querySelector(`[data-tab="${tab}"]`);
    if(navEl) navEl.classList.add('active');
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('sec-'+tab).classList.add('active');
    curTab = tab;
    if(tab==='cart') loadCart();
    else if(tab==='orders') loadOrders(1);
    else if(tab==='address') loadAddresses();
    else if(tab==='reviews') initReviewTab();
    else if(tab==='goods') loadGoods();
    else if(tab==='goods-mgr') loadGoodsMgr(1);
    else if(tab==='review-mgr') loadPendingReviews(1);
}

function logout() { localStorage.clear(); location.href='/auth'; }

// ==================== 分类 ====================
async function loadCategories() {
    try {
        const d = await api('/home/category/tree');
        if(d.code!==0) return;
        const bar = document.getElementById('catBar');
        function render(cats, depth) {
            let html = '';
            cats.forEach(c => {
                const prefix = depth>0?'　'.repeat(depth):'';
                html += `<span class="cat-tag" onclick="filterGoods(${c.id})">${prefix}${c.name}</span>`;
                if(c.children) html += render(c.children, depth+1);
            });
            return html;
        }
        bar.innerHTML = '<span class="cat-tag active" onclick="filterGoods(0)">全部</span>'+render(d.data, 0);
    }catch(e){}
}

// ==================== 商品 ====================
let catFilter = 0;
function filterGoods(catId) {
    catFilter = catId;
    document.querySelectorAll('#catBar .cat-tag').forEach((t,i)=>t.classList.toggle('active', i===0?catId===0:false));
    renderGoods();
}

async function loadGoods() {
    try {
        const d = await api('/home/');
        if(d.code===0&&d.data){ goodsCache = Array.isArray(d.data)?d.data:(d.data.list||d.data.items||[]); }
        renderGoods();
    }catch(e){}
}

function renderGoods() {
    const grid = document.getElementById('goodsGrid');
    let list = goodsCache;
    if(catFilter>0) list = list.filter(g=>g.category_id===catFilter);
    if(!list.length){ grid.innerHTML='<div class="empty">暂无商品</div>'; return; }
    grid.innerHTML = list.map(g=>`
        <div class="gcard">
            <div class="gname">${esc(g.goodsname||g.goodsName)}</div>
            <div class="gmeta">库存: ${g.goodsnum||g.goodsNum} | 销量: ${g.sales||0} | <a href="javascript:void(0)" onclick="switchSection('reviews');document.getElementById('revGoodsSelect').value='${g.id}';loadReviews()" style="color:var(--pri);">查看评价</a></div>
            <div class="gprice"><span>¥</span>${g.price}</div>
            <div class="gact">
                <input type="number" value="1" min="1" max="${g.goodsnum||g.goodsNum}" id="qty_${g.id}">
                <button class="btn btn-pri btn-sm" onclick="addCart(${g.id})">加入购物车</button>
                <button class="btn btn-out btn-sm" onclick="buyNow(${g.id})">立即购买</button>
            </div>
        </div>
    `).join('');
}

function esc(s) { return s?String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }

// ==================== 购物车 ====================
async function addCart(goodsId) {
    const qty = parseInt(document.getElementById('qty_'+goodsId)?.value||1);
    const d = await api('/home/cart/add', {method:'POST',body:JSON.stringify({goods_id:goodsId,quantity:qty})});
    if(d.code===0){ toast('已加入购物车'); loadCartBadge(); }
    else toast(d.message,'error');
}

async function buyNow(goodsId) {
    const qty = parseInt(document.getElementById('qty_'+goodsId)?.value||1);
    // 先看看有没有地址
    const ad = await api('/home/address/list');
    if(ad.code!==0||!ad.data||!ad.data.length){ toast('请先添加收货地址','error'); switchSection('address'); return; }
    showQuickBuy(goodsId, qty, ad.data);
}

let quickBuyAddr = null;
let quickBuyGoods = null;
let quickBuyQty = 0;

function showQuickBuy(goodsId, qty, addrs) {
    quickBuyGoods = goodsId; quickBuyQty = qty;
    const html = addrs.map(a=>`
        <label style="display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #eee;border-radius:6px;margin-bottom:4px;cursor:pointer;">
            <input type="radio" name="addr" value="${a.id}" onchange="quickBuyAddr=${a.id}"> ${a.receiver} ${a.phone} ${a.province||''}${a.city||''}${a.district||''} ${a.detail}
        </label>`).join('');
    document.getElementById('checkoutAddrs').innerHTML = html;
    document.getElementById('checkoutBtn').textContent = '确认下单';
    document.getElementById('checkoutBtn').onclick = doQuickBuy;
    document.getElementById('checkoutModal').classList.add('show');
}

async function doQuickBuy() {
    if(!quickBuyAddr){ toast('请选择收货地址','error'); return; }
    const d = await api('/home/order/', {method:'POST',body:JSON.stringify({goodsId:quickBuyGoods,buyNum:quickBuyQty,address_id:quickBuyAddr})});
    if(d.code===0){ toast('下单成功! 订单号: '+d.data); closeCheckout(); loadOrders(); }
    else toast(d.message,'error');
}

async function loadCart() {
    const d = await api('/home/cart/list');
    if(d.code!==0||!d.data||!d.data.items||!d.data.items.length){
        document.getElementById('cartList').innerHTML = '<div class="empty">购物车为空</div>';
        document.getElementById('cartFoot').style.display='none';
        return;
    }
    cartCache = d.data;
    document.getElementById('cartFoot').style.display='flex';
    document.getElementById('cartTotal').textContent = '¥'+d.data.total_price;
    document.getElementById('cartList').innerHTML = `
        <div class="card"><table>
            <thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr></thead>

// ==================== 订单 ====================
const STATUS = {0:'待支付',1:'已支付',2:'已取消',3:'已发货',4:'已收货',5:'已完成',6:'退款中',7:'已退款'};
const STATUS_CLS = {0:'badge-pend',1:'badge-paid',2:'badge-cancel',3:'badge-ship',4:'badge-done',5:'badge-done',6:'badge-pend',7:'badge-cancel'};

async function loadOrders(page) {
    if(page) orderPage = page;
    const status = document.getElementById('orderStatusFilter').value;
    let url = `/home/search/orders?page=${orderPage}&size=${orderPageSize}`;
    if(status!=='') url += '&status='+status;
    const d = await api(url);
    // 兼容新旧格式
    let orders = d.data, total = 0;
    if(d.data&&d.data.list) { orders = d.data.list; total = d.data.total; }
    else if(Array.isArray(d.data)) { orders = d.data; total = orders.length; }
    if(!orders||!orders.length){
        document.getElementById('orderList').innerHTML='<div class="empty">暂无订单</div>';
        document.getElementById('orderPager').innerHTML='';
        document.getElementById('orderPageInfo').textContent='';
        return;
    }
    document.getElementById('orderPageInfo').textContent = `共 ${total} 条，第 ${orderPage} 页`;
    document.getElementById('orderList').innerHTML = orders.map(o=>{
        const addr = o.address_snapshot ? (typeof o.address_snapshot==='string' ? JSON.parse(o.address_snapshot) : o.address_snapshot) : null;
        const items = o.items||[];
        const canRefund = (o.status===1||o.status===3||o.status===4) && (userRole==='user');
        const canProcessRefund = o.status===6 && (userRole==='admin'||userRole==='merchant');
        return `
        <div class="card" style="padding:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <b>${o.order_no}</b>
                <span class="badge ${STATUS_CLS[o.status]||'badge-pend'}">${STATUS[o.status]||o.status}</span>
            </div>
            <div style="font-size:13px;color:var(--sub);margin-bottom:8px;">${new Date(o.CreatedAt||o.created_at).toLocaleString()}</div>
            ${items.map(it=>`<div style="font-size:13px;">${esc(it.goods_name)} x${it.quantity} ¥${it.price}</div>`).join('')}
            ${!items.length&&o.goods_name?`<div style="font-size:13px;">${esc(o.goods_name)} ¥${o.price||''}</div>`:''}
            ${addr?`<div style="font-size:12px;color:var(--sub);">📍 ${esc(addr.receiver)} ${esc(addr.phone)} ${esc(addr.detail||'')}</div>`:''}
            <div style="margin-top:4px;font-weight:700;">总计: ¥${o.total_price||0}</div>
            ${o.ship_company?`<div style="font-size:13px;margin-top:4px;">🚚 ${o.ship_company} ${o.ship_no}</div>`:''}
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
                ${o.status===0?`<button class="btn btn-green btn-sm" onclick="payOrder('${o.order_no}')">去支付</button>`:''}
                ${o.status===0?`<button class="btn btn-red btn-sm" onclick="cancelOrder('${o.order_no}')">取消</button>`:''}
                ${canRefund?`<button class="btn btn-out btn-sm" style="color:var(--orange);border-color:var(--orange);" onclick="showRefund('${o.order_no}')">申请退款</button>`:''}
                ${canProcessRefund?`<button class="btn btn-pri btn-sm" onclick="showRefundProcess('${o.order_no}')">审批退款</button>`:''}
                ${(userRole==='admin'||userRole==='merchant')&&o.status===1?`<button class="btn btn-out btn-sm" onclick="promptShip('${o.order_no}')">发货</button>`:''}
                ${o.status===3?`<button class="btn btn-pri btn-sm" onclick="confirmOrder('${o.order_no}')">确认收货</button>`:''}
                ${o.status===4?`<button class="btn btn-green btn-sm" onclick="completeOrder('${o.order_no}')">完成</button>`:''}
                ${o.status>=3?`<button class="btn btn-out btn-sm" onclick="showReview('${items.length?items[0].goods_id:(o.goods_id||'')}','${o.order_no}')">评价</button>`:''}
            </div>
        </div>`}).join('');
    // 分页器
    const totalPages = Math.ceil(total/orderPageSize);
    let pagerHtml = '';
    if(totalPages>1){
        pagerHtml += `<button class="btn btn-out btn-sm" onclick="loadOrders(${orderPage-1})" ${orderPage<=1?'disabled':''}>上一页</button>`;
        for(let i=Math.max(1,orderPage-2);i<=Math.min(totalPages,orderPage+2);i++){
            pagerHtml += `<button class="btn btn-sm ${i===orderPage?'btn-pri':'btn-out'}" onclick="loadOrders(${i})">${i}</button>`;
        }
        pagerHtml += `<button class="btn btn-out btn-sm" onclick="loadOrders(${orderPage+1})" ${orderPage>=totalPages?'disabled':''}>下一页</button>`;
    }
    document.getElementById('orderPager').innerHTML = pagerHtml;
}

async function saveGoods() {
    const id = document.getElementById('goodsEditId').value;
    const body = {
        goodsname: document.getElementById('gformName').value,
        price: parseInt(document.getElementById('gformPrice').value)||0,
        goodsnum: parseInt(document.getElementById('gformStock').value)||0,
        category_id: parseInt(document.getElementById('gformCategory').value)||null,
        image_url: document.getElementById('gformImage').value||'',
        status: parseInt(document.getElementById('gformStatus').value)
    };
    if(!body.goodsname){ toast('商品名称必填','error'); return; }

    let d;
    if(id){
        // 更新：只传有值的字段
        const updates = {};
        if(body.goodsname) updates.goodsname = body.goodsname;
        if(body.price) updates.price = body.price;
        if(body.goodsnum) updates.goodsnum = body.goodsnum;
        if(body.category_id) updates.category_id = body.category_id;
        if(body.image_url!==undefined) updates.image_url = body.image_url;
        if(body.status!==undefined) updates.status = body.status;
        d = await api('/home/goods/'+id, {method:'PUT',body:JSON.stringify(updates)});
    } else {
        d = await api('/home/goods/', {method:'POST',body:JSON.stringify(body)});
    }
    if(d.code===0){ toast(id?'商品已更新':'商品已创建'); closeGoodsForm(); loadGoodsMgr(goodsMgrPage); loadGoods(); }

            </div>
        </div>
    `).join('');
    const totalPages = Math.ceil(total/pendingReviewPageSize);
    let pagerHtml = '';
    if(totalPages>1){
        pagerHtml += `<button class="btn btn-out btn-sm" onclick="loadPendingReviews(${pendingReviewPage-1})" ${pendingReviewPage<=1?'disabled':''}>上一页</button>`;
        for(let i=Math.max(1,pendingReviewPage-2);i<=Math.min(totalPages,pendingReviewPage+2);i++){
            pagerHtml += `<button class="btn btn-sm ${i===pendingReviewPage?'btn-pri':'btn-out'}" onclick="loadPendingReviews(${i})">${i}</button>`;
        }
        pagerHtml += `<button class="btn btn-out btn-sm" onclick="loadPendingReviews(${pendingReviewPage+1})" ${pendingReviewPage>=totalPages?'disabled':''}>下一页</button>`;
    }
    document.getElementById('pendingReviewPager').innerHTML = pagerHtml;
}

async function approveReview(id) {
    const d = await api('/home/review/'+id+'/approve', {method:'POST'});
    if(d.code===0){ toast('评价已通过'); loadPendingReviews(pendingReviewPage); }
    else toast(d.message,'error');
}

async function rejectReview(id) {
    const d = await api('/home/review/'+id+'/reject', {method:'POST'});
    if(d.code===0){ toast('评价已驳回'); loadPendingReviews(pendingReviewPage); }
    else toast(d.message,'error');
}
</script>
