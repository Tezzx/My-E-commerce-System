basePath: /
definitions:
  order-payment-system_internal_types.AddCartReq:
    properties:
      goods_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - goods_id
    - quantity
    type: object
  order-payment-system_internal_types.AddressReq:
    properties:
      city:
        type: string
      detail:
        maxLength: 200
        type: string
      district:
        type: string
      is_default:
        type: boolean
      phone:
        maxLength: 20
        type: string
      province:
        type: string
      receiver:
        maxLength: 50
        type: string
    required:
    - detail
    - phone
    - receiver
    type: object
  order-payment-system_internal_types.AddressResp:
    properties:
      city:
        type: string
      detail:
        type: string
      district:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      phone:
        type: string
      province:
        type: string
      receiver:
        type: string
    type: object
  order-payment-system_internal_types.CartCheckoutReq:
    properties:
      address_id:
        description: 必填
        type: integer
    required:
    - address_id
    type: object
  order-payment-system_internal_types.CartItemResp:
    properties:
      goods_id:
        type: integer
      goods_name:
        type: string
      id:
        type: integer
      price:
        type: integer
      quantity:
        type: integer
      selected:
        type: boolean
    type: object
  order-payment-system_internal_types.CartListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/order-payment-system_internal_types.CartItemResp'
        type: array
      total_price:
        description: 仅计算selected的
        type: integer
    type: object
  order-payment-system_internal_types.CategoryReq:
    properties:
      name:
        maxLength: 50
        type: string
      parent_id:
        description: nil=一级分类
        type: integer
      sort:
        type: integer
    required:
    - name
    type: object
  order-payment-system_internal_types.CategoryResp:
    properties:
      children:
        items:
          $ref: '#/definitions/order-payment-system_internal_types.CategoryResp'
        type: array
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      sort:
        type: integer
    type: object
  order-payment-system_internal_types.Goods:
    properties:
      category_id:
        type: integer
      goodsname:
        type: string
      goodsnum:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      price:
        type: integer
      sales:
        type: integer
    type: object
  order-payment-system_internal_types.LoginRequest:
    properties:
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  order-payment-system_internal_types.OrderItemResp:
    properties:
      goods_id:
        type: integer
      goods_name:
        type: string
      id:
        type: integer
      price:
        type: integer
      quantity:
        type: integer
    type: object
  order-payment-system_internal_types.OrderLogResp:
    properties:
      created_at:
        type: string
      id:
        type: integer
      new_status:
        type: integer
      old_status:
        type: integer
      order_no:
        type: string
      remark:
        type: string
    type: object
  order-payment-system_internal_types.OrderRequest:
    properties:
      address_id:
        description: 收货地址ID
        type: integer
      buyNum:
        type: integer
      goodsId:
        type: integer
    type: object
  order-payment-system_internal_types.OrderResp:
    properties:
      address_snapshot:
        $ref: '#/definitions/order-payment-system_internal_types.AddressResp'
      created_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/order-payment-system_internal_types.OrderItemResp'
        type: array
      order_no:
        type: string
      pay_time:
        type: string
      ship_company:
        type: string
      ship_no:
        type: string
      status:
        type: integer
      status_name:
        type: string
      total_price:
        type: integer
      user_id:
        type: integer
    type: object
  order-payment-system_internal_types.RegisterRequest:
    properties:
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  order-payment-system_internal_types.ReviewReq:
    properties:
      content:
        maxLength: 500
        type: string
      goods_id:
        type: integer
      is_anon:
        type: boolean
      order_no:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - goods_id
    - order_no
    - rating
    type: object
  order-payment-system_internal_types.ShipRequest:
    properties:
      order_no:
        type: string
      ship_company:
        type: string
      ship_no:
        type: string
    required:
    - order_no
    - ship_company
    - ship_no
    type: object
  order-payment-system_internal_types.ToggleSelectReq:
    properties:
      goods_id:
        type: integer
      selected:
        type: boolean
    required:
    - goods_id
    type: object
  order-payment-system_internal_types.UpdateCartReq:
    properties:
      goods_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
    required:
    - goods_id
    - quantity
    type: object
  order-payment-system_pkg_response.Resp:
    properties:
      code:
        description: 业务码
        type: integer
      data:
        description: 数据
      message:
        description: 提示信息
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: 电商订单支付系统 API 文档
  title: Order Payment System API
  version: "1.0"
paths:
  /api/notify/alipay:
    post:
      consumes:
      - application/json
      parameters:
      - description: 支付宝回调参数
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - text/plain
