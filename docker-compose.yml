version: '3.8'

services:
  ops_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ops_app
    ports:
      - "8080:8080"  
    environment:
      - ENV=development
    volumes:
      - ./config:/app/config
      - ./templates:/app/templates
    depends_on:
      ops_mysql:
        condition: service_healthy
      ops_redis:
        condition: service_started
      ops_rabbitmq:
        condition: service_started
    networks:
      - ops-network

  ops_mysql:
    image: mysql:8.0
    container_name: ops_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=order_payment_db
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  ops_redis:
    image: redis:7-alpine
    container_name: ops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # 可选配置 Redis 的密码
    # command: redis-server --requirepass "yourpassword"
    networks:
      - ops-network

  ops_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ops_rabbitmq
    ports:
      - "5672:5672"    # MQ 通信端口
      - "15672:15672"  # MQ 管理界面端口
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ops-network

networks:
  ops-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data: